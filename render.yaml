services:
  # BACKEND: Express API
  - type: web
    name: industry5-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_URI_LOCAL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # FRONTEND: React Static Site
  - type: static
    name: industry5-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: industry5-backend
          property: host
